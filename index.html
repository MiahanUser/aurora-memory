    <title>禹含 · 永恒记忆深处</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700;900&family=Ma+Shan+Zheng&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --star-gold: #fde68a;
            --deep-void: #020617;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        body {
            margin: 0;
            background-color: var(--deep-void);
            color: #f8fafc;
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            height: 100vh;
            width: 100vw;
        }
        .font-calligraphy {
            font-family: 'Ma Shan Zheng', cursive;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        /* 针对 iPhone 16 Pro Max 的大屏与高频流畅感 */
        .safe-pb { padding-bottom: var(--safe-bottom); }
        .safe-pt { padding-top: var(--safe-top); }

        /* 极致视觉：色散与辉光 */
        .chromatic-glow {
            text-shadow: 
                2px 0 rgba(255,0,0,0.3), 
                -2px 0 rgba(0,255,255,0.3),
                0 0 15px rgba(253,230,138,0.4);
        }

        /* 电影感滤镜 */
        .cinematic-vignette {
            background: radial-gradient(circle, transparent 20%, rgba(2, 6, 23, 0.8) 100%);
            pointer-events: none;
        }

        @keyframes nebula-pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        /* 极速流光 */
        .shimmer-text {
            background: linear-gradient(90deg, #fde68a 0%, #fff 50%, #fde68a 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        canvas {
            image-rendering: -webkit-optimize-contrast;
        }
    </style>
